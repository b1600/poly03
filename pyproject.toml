[project]
name = "poly03"
version = "0.1.0"
description = "Polymarket 'boring edge' bot (Strategy v1, Phase 0 backtest/research stack)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "py-clob-client>=0.34.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
poly03 = "poly03.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poly03"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
